spring:
  application:
    name: ip-sakti-backend

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:11MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.enkutrmzkeeuehklpwde}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
      keepalive-time: 15000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Supabase API keys (loaded from environment variables)
supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# RAG microservice connection
rag:
  base-url: ${RAG_BASE_URL:http://localhost:8000}
  connect-timeout: ${RAG_CONNECT_TIMEOUT:5s}
  read-timeout: ${RAG_READ_TIMEOUT:60s}
  default-top-k: ${RAG_TOP_K:8}

app:
  security:
    mode: ${BACKEND_SECURITY_MODE:dev}
    api-key: ${BACKEND_API_KEY:}
    allowed-origins: ${BACKEND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  jwt:
    issuer: ${BACKEND_JWT_ISSUER:ip-sakti-sahayak}
    secret: ${BACKEND_JWT_SECRET:}
    access-token-ttl: ${BACKEND_JWT_ACCESS_TOKEN_TTL:30m}

gemini:
  enabled: ${GEMINI_ENABLED:true}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-2.5-flash,gemini-2.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-lite-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:2s}
  read-timeout: ${GEMINI_READ_TIMEOUT:10s}

voice:
  enabled: ${VOICE_ENABLED:true}
  max-audio-bytes: ${VOICE_MAX_AUDIO_BYTES:10485760}
  request-timeout: ${VOICE_REQUEST_TIMEOUT:90s}
  tts-model: ${GEMINI_TTS_MODEL:gemini-3.1-flash-tts-preview}
  tts-voice: ${GEMINI_TTS_VOICE:Kore}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web.client: ${SPRING_WEB_CLIENT_LOG_LEVEL:INFO}
    org.springframework.http.converter: ${SPRING_HTTP_CONVERTER_LOG_LEVEL:INFO}
