spring:
  application:
    name: ip-sakti-backend

  datasource:
    url: jdbc:postgresql://db.jqggmtbfujmpnplwzbyn.supabase.co:5432/postgres
    username: postgres
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Supabase API keys (loaded from environment variables)
supabase:
  url: https://jqggmtbfujmpnplwzbyn.supabase.co
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

server:
  port: 8080
